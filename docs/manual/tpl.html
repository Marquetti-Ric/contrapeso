<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Contrapeso — Manual de uso</title>
<style>
{{FONTS}}
@page{size:A4;margin:18mm 17mm 20mm 17mm}
@page cover{margin:0}
:root{--ink:#13201B;--muted:#56645E;--line:#D3DCD8;--sunk:#EDF1EF;--accent:#AE4E17;--accent-soft:#F6E5D9;--gain:#1B7C52;--loss:#B4233A;--warn:#9A6400;--warn-soft:#F6EBD3;
 --fd:"Archivo",Arial,sans-serif;--fb:"IBM Plex Sans",system-ui,sans-serif;--fm:"IBM Plex Mono",ui-monospace,monospace}
*{box-sizing:border-box}
html{-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{margin:0;font-family:var(--fb);font-size:10pt;line-height:1.5;color:var(--ink);background:#fff}
h1,h2,h3,h4{font-family:var(--fd);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:22pt;font-stretch:112%;font-weight:800;line-height:1.1;margin:0 0 4mm;break-after:avoid}
h3{font-size:13pt;font-weight:700;font-stretch:108%;margin:7mm 0 2mm;break-after:avoid}
h4{font-size:10.5pt;font-weight:700;margin:4mm 0 1.5mm;break-after:avoid}
p{margin:0 0 2.6mm;max-width:165mm;orphans:3;widows:3}
a{color:var(--accent)}
.eyebrow{font-family:var(--fm);font-size:7.5pt;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.chapter{break-before:page}
.chapter > .eyebrow{display:block;margin-bottom:2mm;color:var(--accent)}
.lead{font-size:11.5pt;color:var(--muted);max-width:160mm;margin-bottom:5mm}
code,.mono{font-family:var(--fm);font-size:8.6pt;background:var(--sunk);padding:.2mm 1.2mm;border-radius:1mm}
ol.steps{counter-reset:s;list-style:none;padding:0;margin:2mm 0 4mm;display:grid;gap:2.2mm}
ol.steps>li{counter-increment:s;display:grid;grid-template-columns:8mm 1fr;gap:2mm;break-inside:avoid}
ol.steps>li::before{content:counter(s);font-family:var(--fd);font-weight:800;font-size:10pt;width:6.5mm;height:6.5mm;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center}
ul{margin:1mm 0 3mm;padding-left:5mm}
li{margin:.6mm 0}
table{border-collapse:collapse;width:100%;font-size:8.8pt;margin:2mm 0 4mm;break-inside:auto}
th,td{text-align:left;vertical-align:top;padding:1.8mm 2.2mm;border-bottom:.25mm solid var(--line)}
thead th{font-family:var(--fm);font-weight:500;font-size:7pt;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--sunk);border-bottom:0}
tr{break-inside:avoid}
td:first-child{font-weight:600;white-space:nowrap}
td.wrap:first-child{white-space:normal}
.note{border-left:1mm solid var(--accent);background:var(--accent-soft);padding:2.6mm 3.5mm;margin:3mm 0 4mm;border-radius:0 1.5mm 1.5mm 0;break-inside:avoid;font-size:9.4pt}
.note b:first-child{display:block;font-family:var(--fd);font-size:9.6pt;margin-bottom:.6mm}
.note.warn{border-color:var(--warn);background:var(--warn-soft)}
.note p:last-child{margin-bottom:0}
figure.shot{margin:3mm 0 5mm;break-inside:avoid}
.frame{position:relative;border:.3mm solid var(--line);border-radius:2mm;overflow:hidden;box-shadow:0 .6mm 2mm rgba(19,32,27,.08)}
.frame img{display:block;width:100%;height:auto}
.box{position:absolute;border:.55mm solid var(--accent);border-radius:1.2mm}
.pin{position:absolute;transform:translate(-45%,-45%);width:6mm;height:6mm;border-radius:50%;background:var(--accent);color:#fff;font-family:var(--fd);font-weight:800;font-size:8.5pt;display:grid;place-items:center;border:.5mm solid #fff;box-shadow:0 .4mm 1mm rgba(0,0,0,.25)}
figcaption{font-size:8pt;color:var(--muted);margin-top:1.6mm;font-family:var(--fm)}
ol.legend{list-style:none;padding:0;margin:2mm 0 0;display:grid;grid-template-columns:1fr 1fr;gap:1.4mm 6mm;font-size:8.8pt}
ol.legend li{display:grid;grid-template-columns:6mm 1fr;gap:1.6mm;margin:0;align-items:start}
ol.legend b{width:5mm;height:5mm;border-radius:50%;background:var(--accent);color:#fff;font-family:var(--fd);font-size:7.5pt;display:grid;place-items:center}
.chips span{display:inline-block;font-size:7.8pt;padding:.3mm 2mm;border-radius:5mm;font-weight:600}
.g{background:#DCF0E5;color:var(--gain)}.l{background:#F8DEE2;color:var(--loss)}.w{background:var(--warn-soft);color:var(--warn)}.n{background:var(--sunk);color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:6mm}
.kbd{font-family:var(--fm);font-size:8pt;border:.3mm solid var(--line);border-bottom-width:.6mm;border-radius:1mm;padding:0 1.2mm}
/* capa */
.cover{page:cover;height:297mm;width:210mm;background:#13201B;color:#F2F3F1;padding:22mm 20mm;display:grid;grid-template-rows:auto 1fr auto;break-after:page;position:relative;overflow:hidden}
.cover .brand{display:flex;align-items:center;gap:4mm;color:#F2F3F1}
.cover .brand .mark{width:13mm;height:13mm}
.cover .brand span{font-family:var(--fd);font-stretch:118%;font-weight:800;font-size:22pt}
.cover .bigmark{position:absolute;right:-18mm;top:34mm;width:170mm;height:170mm}
.cover h1{font-family:var(--fd);font-stretch:118%;font-weight:800;font-size:46pt;line-height:.98;letter-spacing:-.02em;align-self:end;margin-bottom:8mm}
.cover h1 em{font-style:normal;color:#F0955E}
.cover .sub{font-size:13pt;color:#B9C6C0;max-width:130mm;margin:0}
.cover .meta{display:flex;justify-content:space-between;font-family:var(--fm);font-size:8.5pt;color:#93A29C;border-top:.3mm solid #2A3631;padding-top:5mm}
/* sumário */
.toc{list-style:none;padding:0;margin:4mm 0;display:grid;gap:0}
.toc li{display:grid;grid-template-columns:12mm 1fr;padding:2.6mm 0;border-bottom:.25mm solid var(--line);margin:0}
.toc .n{font-family:var(--fd);font-weight:800;color:var(--accent);font-size:12pt}
.toc a{color:var(--ink);text-decoration:none;font-family:var(--fd);font-weight:700;font-size:12pt}
.toc small{display:block;font-family:var(--fb);font-weight:400;color:var(--muted);font-size:9pt}
</style></head><body>
{{BODY}}
</body></html>
