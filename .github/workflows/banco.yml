name: Publicar banco e função

on:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/banco.yml']
  pull_request:
    paths: ['supabase/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase
  cancel-in-progress: false

jobs:
  testar-regras:
    name: Testar isolamento entre empresas
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar migrações sobre um auth simulado e rodar os testes
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q \
            -f supabase/tests/stub_auth.sql \
            $(for f in supabase/migrations/*.sql; do echo "-f $f"; done) \
            -f supabase/tests/rls_test.sql

  publicar:
    name: Publicar no Supabase
    needs: testar-regras
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SITE_URL: https://marquetti-ric.github.io/contrapeso
    steps:
      - uses: actions/checkout@v4
      - name: Verificar se o Supabase está configurado
        id: cfg
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$PROJECT_REF" ]; then
            echo "::notice::Secrets do Supabase ainda não cadastrados. Publicação do banco pulada."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.cfg.outputs.ok == 'true'
        with:
          version: latest
      - name: Aplicar migrações do banco
        if: steps.cfg.outputs.ok == 'true'
        run: |
          supabase link --project-ref "$PROJECT_REF" -p "$SUPABASE_DB_PASSWORD"
          supabase db push -p "$SUPABASE_DB_PASSWORD"
      - name: Publicar a função de convites
        if: steps.cfg.outputs.ok == 'true'
        run: |
          supabase secrets set --project-ref "$PROJECT_REF" SITE_URL="$SITE_URL" ORIGENS_PERMITIDAS="https://marquetti-ric.github.io"
          supabase functions deploy usuarios --project-ref "$PROJECT_REF"
      - name: Configurar login (endereços, senha mínima e e-mails em português)
        if: steps.cfg.outputs.ok == 'true'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_SENDER: ${{ secrets.SMTP_SENDER }}
        run: |
          jq -n \
            --arg site "$SITE_URL/" \
            --arg allow "$SITE_URL/**" \
            --rawfile convite supabase/templates/convite.html \
            --rawfile confirmacao supabase/templates/confirmacao.html \
            --rawfile recuperacao supabase/templates/recuperacao.html \
            '{site_url:$site, uri_allow_list:$allow, password_min_length:8,
              mailer_subjects_invite:"Você foi convidado para o Contrapeso",
              mailer_subjects_confirmation:"Confirme o seu e-mail no Contrapeso",
              mailer_subjects_recovery:"Crie uma senha nova no Contrapeso",
              mailer_templates_invite_content:$convite,
              mailer_templates_confirmation_content:$confirmacao,
              mailer_templates_recovery_content:$recuperacao}' > auth.json
          if [ -n "$SMTP_HOST" ] && [ -n "$SMTP_USER" ] && [ -n "$SMTP_PASS" ] && [ -n "$SMTP_SENDER" ]; then
            jq --arg h "$SMTP_HOST" --arg p "${SMTP_PORT:-587}" --arg u "$SMTP_USER" --arg s "$SMTP_PASS" --arg f "$SMTP_SENDER" \
              '. + {external_email_enabled:true, smtp_host:$h, smtp_port:$p, smtp_user:$u, smtp_pass:$s, smtp_admin_email:$f, smtp_sender_name:"Contrapeso", rate_limit_email_sent:100}' auth.json > a2.json && mv a2.json auth.json
            echo "SMTP próprio configurado."
          else
            echo "::warning::Sem SMTP próprio: o e-mail padrão do Supabase só entrega para membros da equipe do projeto e tem limite baixo por hora. Cadastre os secrets SMTP_* para liberar convites e confirmações para qualquer pessoa."
          fi
          code=$(curl -sS -o resp.json -w '%{http_code}' -X PATCH "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @auth.json)
          if [ "$code" -ge 300 ]; then echo "Falha ao configurar o login ($code):"; cat resp.json; exit 1; fi
          echo "Login configurado."
